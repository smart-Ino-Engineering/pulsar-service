name: pulsar-service Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production
      - staging
      - develop
  pull_request:
    branches:
      - main
      - production
      - staging
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-formatting-and-lint:
    name: Code Formatting & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Auto-Format Code (Black & isort)
        run: |
          black .
          isort --profile black .

      - name: Commit Auto-Formatting (Non-production branches only)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: auto-format Python code (black & isort) [skip ci]"
            git push || echo "::warning::Could not push auto-formatting commits"
          else
            echo "Codebase is cleanly formatted. No changes needed."
          fi

      - name: Verify Code Formatting Compliance
        run: |
          black --check --diff .
          isort --check-only --profile black .

      - name: Lint Code (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,migrations
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=venv,.venv,migrations

  security-scan:
    name: Security Vulnerability Scan (SAST & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Static Application Security Testing (Bandit)
        run: |
          bandit -r . -ll -ii -x ./tests,./venv,./.venv,./migrations --exit-zero

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          fi

  unit-and-integration-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov || true

      - name: Run Test Suite
        run: |
          if [ -d "tests" ]; then
            pytest -v tests/ || true
          else
            echo "No tests directory found, skipping."
          fi

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [code-formatting-and-lint, security-scan, unit-and-integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH to Staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER || 'root' }}
          password: ${{ secrets.STAGING_PASSWORD }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          timeout: 180s
          script: |
            set -e
            echo "=========================================================="
            echo "=== Staging Deployment for pulsar-service ==="
            echo "=== Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }} ==="
            echo "=========================================================="
            
            TARGET_DIR="${{ secrets.STAGING_DEPLOY_PATH || '/root/pulsar-service' }}"
            if [ ! -d "$TARGET_DIR" ]; then
              for dir in "/var/www/staging-pulsar-service" "/root/staging-pulsar-service" "/root/pulsar-service"; do
                if [ -d "$dir" ]; then
                  TARGET_DIR="$dir"
                  break
                fi
              done
            fi
            
            echo "Deploying to: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }} || true
            git pull origin ${{ github.ref_name }}
            
            if [ -f "./run-service.sh" ]; then
              echo "=== Deploying using run-service.sh ==="
              chmod +x ./run-service.sh
              ./run-service.sh --no-backup || ./run-service.sh
            elif [ -f "./run_service.sh" ]; then
              echo "=== Deploying using run_service.sh ==="
              chmod +x ./run_service.sh
              ./run_service.sh
            else
              echo "=== Deploying using docker compose ==="
              docker compose up -d --remove-orphans
            fi
            
            echo "=== Deployment Status ==="
            docker ps --filter "name=pulsar" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -n 15
            echo "=== pulsar-service Deployed Successfully to Staging! ==="

  deploy-production:
    name: Deploy to Production Environment
    needs: [code-formatting-and-lint, security-scan, unit-and-integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST || secrets.CONTABO_HOST }}
          username: ${{ secrets.PROD_USER || secrets.CONTABO_USER || 'root' }}
          password: ${{ secrets.PROD_PASSWORD || secrets.CONTABO_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY || secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          timeout: 180s
          script: |
            set -e
            echo "=========================================================="
            echo "=== Production Deployment for pulsar-service ==="
            echo "=== Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }} ==="
            echo "=========================================================="
            
            TARGET_DIR="${{ secrets.PROD_DEPLOY_PATH || '/root/pulsar-service' }}"
            if [ ! -d "$TARGET_DIR" ]; then
              for dir in "/var/www/pulsar-service" "/root/pulsar-service"; do
                if [ -d "$dir" ]; then
                  TARGET_DIR="$dir"
                  break
                fi
              done
            fi
            
            echo "Deploying to: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }} || true
            git pull origin ${{ github.ref_name }}
            
            if [ -f "./run-service.sh" ]; then
              echo "=== Deploying using run-service.sh ==="
              chmod +x ./run-service.sh
              ./run-service.sh --no-backup || ./run-service.sh
            elif [ -f "./run_service.sh" ]; then
              echo "=== Deploying using run_service.sh ==="
              chmod +x ./run_service.sh
              ./run_service.sh
            else
              echo "=== Deploying using docker compose ==="
              docker compose up -d --remove-orphans
            fi
            
            echo "=== Deployment Status ==="
            docker ps --filter "name=pulsar" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -n 15
            echo "=== pulsar-service Deployed Successfully to Production! ==="
